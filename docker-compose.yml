version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: imedics
      POSTGRES_USER: imedics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imedics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ───────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-miniosecret}
    volumes:
      - miniodata:/data

  # ── Backend (NestJS) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://imedics:${DB_PASSWORD:-devpassword}@postgres:5432/imedics
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-access-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-dev-service-token}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=${MINIO_PASSWORD:-miniosecret}
      - S3_BUCKET=imedics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  # ── AI Service (FastAPI) ────────────────────────────────
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-dev-service-token}
      - AI_LLM_PROVIDER=openai
      - AI_LLM_MODEL=gpt-4-turbo
      - AI_LLM_API_KEY=${OPENAI_API_KEY:-}
      - AI_VECTOR_DB_URL=postgresql://imedics:${DB_PASSWORD:-devpassword}@postgres:5432/imedics
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai_service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  miniodata:
