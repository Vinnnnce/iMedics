name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imedics_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: imedics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imedics_ci -d imedics_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable CI databases, never an external or production datasource.
      DATABASE_URL: postgresql://imedics_ci:ci-only-disposable@localhost:5432/imedics_ci
      DIRECT_URL: postgresql://imedics_ci:ci-only-disposable@localhost:5432/imedics_ci
      TEST_DATABASE_URL: postgresql://imedics_ci:ci-only-disposable@localhost:5432/imedics_ci
      HIS_TEST_DATABASE_URL: postgresql://imedics_ci:ci-only-disposable@localhost:5432/imedics_his_acceptance
      PGPASSWORD: ci-only-disposable
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate both disposable test databases
        run: |
          psql -h localhost -U imedics_ci -d imedics_ci -c 'CREATE DATABASE imedics_his_acceptance'
          npx prisma migrate deploy
          DATABASE_URL="$HIS_TEST_DATABASE_URL" DIRECT_URL="$HIS_TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Never run production migrations from CI. The build uses the migrated
      # disposable service; the authorized Vercel deployment owns live deploys.
      - run: npx prisma generate && npx next build
