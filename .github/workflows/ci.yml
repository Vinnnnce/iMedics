name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build can run without real services.
      DATABASE_URL: postgresql://user:password@localhost:5432/medic1905
      DIRECT_URL: postgresql://user:password@localhost:5432/medic1905
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # CI has no database service — deploy-time migrations run on Vercel (real
      # database), so build here without `prisma migrate deploy`.
      - run: npx prisma generate && npx next build
