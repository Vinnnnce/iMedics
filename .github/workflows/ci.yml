name: CI

on:
  push:
    branches: [main, develop, "payments-platform"]
  pull_request:
    branches: [main, develop, "payments-platform"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medic1905_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy values so the build can run without real services.
      DATABASE_URL: postgresql://user:password@localhost:5432/medic1905
      DIRECT_URL: postgresql://user:password@localhost:5432/medic1905
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck

      # A disposable migrated database so the payment-flow integration tests actually run
      # (they skip locally when TEST_DATABASE_URL is not set).
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/medic1905_test
          DIRECT_URL: postgresql://user:password@localhost:5432/medic1905_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/medic1905_test

      - run: npm run build
