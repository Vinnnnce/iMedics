name: Windows app (EXE installer)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm install
          npx tauri build
        env:
          TAURI_UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY }}

      - name: Generate updater signature
        if: ${{ secrets.TAURI_UPDATER_KEY != '' }}
        shell: bash
        env:
          TAURI_UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
        run: |
          npm install -g @tauri-apps/cli
          exe=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          npx tauri signer sign --key "$TAURI_UPDATER_KEY" "$exe"

      - name: Collect artifacts + checksums
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe "$RUNNER_TEMP/out/" || true
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi "$RUNNER_TEMP/out/" || true
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.sig "$RUNNER_TEMP/out/" 2>/dev/null || true
          cd "$RUNNER_TEMP/out"
          sha256sum * > SHA256SUMS-windows.txt || true
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
