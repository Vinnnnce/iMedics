name: Android app (APK + AAB)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Capacitor project
        working-directory: apps/mobile
        run: |
          npm install
          node scripts/build-www.mjs
          npx cap add android

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/m1905.keystore"

      - name: Build signed release APK + AAB
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        working-directory: apps/mobile/android
        env:
          KS_PATH: ${{ runner.temp }}/m1905.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KS_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build unsigned release APK + AAB (no signing secrets configured)
        if: ${{ secrets.ANDROID_KEYSTORE == '' }}
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Collect artifacts + checksums
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/" || true
          cp apps/mobile/android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/" || true
          cd "$RUNNER_TEMP/out"
          sha256sum * > SHA256SUMS-android.txt || true
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
